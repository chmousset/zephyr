description: Allwinner D1s/F133 SPI controller

compatible: "allwinner,sun20i-d1-spi"

include: [spi-controller.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  clocks:
    type: phandle-array
    description: Bus clock gate/reset for the SPI controller.
