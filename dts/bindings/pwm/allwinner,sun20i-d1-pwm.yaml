description: Allwinner D1s/F133 PWM controller

compatible: "allwinner,sun20i-d1-pwm"

include: [pwm-controller.yaml, pinctrl-device.yaml]

properties:
  reg:
    type: array
    required: true

  clocks:
    type: phandle-array
    description: Bus clock gate/reset for the PWM controller.

  "#pwm-cells":
    type: int
    const: 3

pwm-cells:
  - channel
  - period
  - flags
